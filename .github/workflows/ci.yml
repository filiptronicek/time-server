name: Rust

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@vde0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose
